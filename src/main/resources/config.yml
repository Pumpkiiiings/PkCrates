# PkCrates - Global configuration

settings:
  # Enable bStats metrics (recommended - helps support development)
  metrics: true

  # Chat message prefix
  prefix: '<gray>[<gradient:#4287f5:#42d4f5>PkCrates</gradient>] <reset>'

# ─────────────────────────────────────────────────────────────────────────────
# CLAIM MODULE
# Stores rewards that could not be delivered immediately so players can
# retrieve them later via /crate claim.
# ─────────────────────────────────────────────────────────────────────────────
claim:
  # Master switch — set to false to disable the entire claim system.
  enabled: true

  # Conditions under which a reward is automatically stored instead of dropped.
  store-if:
    # Store if the player's inventory is full at delivery time.
    inventory-full: true
    # Store if the player is offline when the reward is generated.
    player-offline: true
    # Store if any unexpected error occurs during normal delivery.
    delivery-failed: true

  # Storage limits per player.
  #
  # ── Permission-based limits (recommended) ─────────────────────────────────
  # Grant one or more of the following permissions to players or groups.
  # When a player holds multiple limit permissions, the HIGHEST value wins.
  #
  #   pkcrates.claim.limit.5
  #   pkcrates.claim.limit.10
  #   pkcrates.claim.limit.25
  #   pkcrates.claim.limit.50
  #   pkcrates.claim.limit.100
  #   pkcrates.claim.limit.250
  #   pkcrates.claim.limit.500
  #   pkcrates.claim.limit.1000
  #   pkcrates.claim.limit.unlimited   ← overrides all numeric permissions
  #
  # Players with 'pkcrates.admin' are also treated as unlimited.
  #
  # ── Config fallback ────────────────────────────────────────────────────────
  # If the player has NO limit permission at all, the value below is used.
  # Set to -1 for unlimited by default.
  limits:
    maximum-stored: -1

  # Player notifications.
  notifications:
    # Notify the player on login if they have pending claims.
    login: true
    # Notify the player immediately when a reward is stored for them.
    reward-stored: true
